name: Internal Test

on:
  push:
    branches:
      - dev
      - gh-workflow
  workflow_dispatch:

jobs:
  publishpackage:
    runs-on: azu-oncology-rd-self-hosted-linux
    environment: deploy-package
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_UN: ${{ secrets.SSH_UN }}
      https_proxy: http://azpzen.astrazeneca.net:9480
      http_proxy: http://azpzen.astrazeneca.net:9480 
      no_proxy: localhost,127.0.0.1,127.0.0.2,.astrazeneca.net,astrazeneca.net    
      # default renv method of curl does not seem
      # to respect proxy settings
      # RENV_DOWNLOAD_METHOD: libcurl
      RENV_CONFIG_SANDBOX_ENABLED: false
    permissions:
      contents: write
    steps:
      # - name: System info
      #  run: cat /etc/os-release
      # - name: Ping localhost
      #   run: |
      #     ping -c 3 login.seml.scp.astrazeneca.net 
      - name: Set up proxy environment variables
        run: |
          echo "Acquire::http::Proxy \"$http_proxy\";" | sudo tee -a /etc/apt/apt.conf
          echo "Acquire::https::Proxy \"$https_proxy\";" | sudo tee -a /etc/apt/apt.conf
      - uses: actions/checkout@v4
      - name: setup ssh creds
        # https://maxschmitt.me/posts/github-actions-ssh-key
        run: |
          mkdir -p /home/runner/.ssh
          echo "${{ secrets.SSH_KEY }}" > /home/runner/.ssh/github_actions
          chmod 600 /home/runner/.ssh/github_actions
          ssh-keyscan -H $DEPLOY_HOST >> /home/runner/.ssh/known_hosts
          # cat /home/runner/.ssh/known_hosts
          # ssh-agent -a $SSH_AUTH_SOCK > /dev/null	
          # ssh-add /home/runner/.ssh/github_actions

      - name: test ssh creds
        run: |
          ssh $SSH_UN@$DEPLOY_HOST -i /home/runner/.ssh/github_actions -f 'touch test.txt' 

