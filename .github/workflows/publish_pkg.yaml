name: Internal Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publishpackage:
    runs-on: azu-oncology-rd-self-hosted-linux
    environment: deploy-package
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      https_proxy: http://azpzen.astrazeneca.net:9480
      http_proxy: http://azpzen.astrazeneca.net:9480 
      RENV_DOWNLOAD_METHOD: libcurl
    permissions:
        contents: write
    steps:
      - uses: actions/checkout@v4
      - id: ssh
        uses: azu-oncology-rd/si-github-r-tools/actions/setup-ssh@v1
        with:
          SSH_USER: ${{ secrets.SSH_UN }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          test-connection: false
      - uses: azu-oncology-rd/si-github-r-tools/actions/setup-r-and-deps@v1
      - uses: azu-oncology-rd/si-github-r-tools/actions/build-and-deploy-r-package@v1
        with:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_ID_FILE: ${{ steps.ssh.outputs.ssh-id-file }}
          # make sure there is a trailing slash
          REMOTE_MINICRAN: /projects/dsai/public/public_html/aa/si/minicran/
          dry-run: ${{ github.event_name != 'push' }}
          REMOTE_URL: https://pages.seml.scp.astrazeneca.net/aa/si/minicran
